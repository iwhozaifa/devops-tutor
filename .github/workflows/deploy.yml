name: Deploy

# Builds both images, pushes them to ECR and runs deploy/deploy.sh on the EC2
# host through SSM. Required repository variables (Settings > Variables):
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, ECR_REPOSITORY (e.g. devops-tutor),
#   EC2_INSTANCE_ID
# The role is assumed with GitHub OIDC, so no AWS keys are stored here.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # Skipped until the AWS variables are configured
    if: vars.EC2_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}-migrate:${{ github.sha }}
          cache-from: type=gha

      - name: Deploy on EC2 via SSM
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TAG: ${{ github.sha }}
        run: |
          # The deploy scripts ship inside the migrate image, so the host
          # always runs the version that matches the release.
          commands=$(jq -cn --arg repo "$REPO" --arg registry "$REGISTRY" --arg region "$REGION" --arg tag "$TAG" '[
            "set -eu",
            "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($registry)",
            "install -d -m 755 /opt/devops-tutor",
            "docker run --rm --user root -v /opt/devops-tutor:/out \($repo)-migrate:\($tag) cp -r /app/deploy/. /out/",
            "IMAGE_REPO=\($repo) AWS_REGION=\($region) /opt/devops-tutor/deploy.sh \($tag)"
          ]')
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $TAG" \
            --parameters "{\"commands\":$commands,\"executionTimeout\":[\"900\"]}" \
            --query Command.CommandId --output text)
          echo "SSM command $command_id"
          for _ in $(seq 1 90); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "status: $status"
          [ "$status" = "Success" ]
